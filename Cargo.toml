# shell = 主程式（egui 操作視窗、單一執行個體），core = 後端（錄影、轉檔、清單、標註繪製、播放器、系統匣…，可在 Linux 上測試）
# 版本號只在這裡（workspace.package.version）：程式內顯示、exe 的檔案資訊、發佈流程都讀這裡
[workspace]
members = ["core", "shell"]
# vendor/ 裡是改過的第三方套件（不是本專案的程式）：不跑本專案的格式、lint、測試
exclude = ["vendor/epaint"]
resolver = "2"

# egui 的文字排版：中文換行時「）」「，」等全形標點不放在行首、「（」不放在行尾（vendor/epaint/README.md）
[patch.crates-io]
epaint = { path = "vendor/epaint" }

[workspace.package]
version = "3.74.2"
edition = "2021"
publish = false
license = "MIT"

# 發佈版：優先檔案小。不設 panic = "abort"：背景工作出錯時只結束那個工作，不會連同錄影中的程式一起結束
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

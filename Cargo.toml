# Rust 部分：shell = 操作視窗（Tauri / WebView2），core = 後端（錄影、轉檔、清單、HTTP API…，不依賴 Tauri，可在任何平台測試）
[workspace]
members = ["core", "shell"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

# 發佈版：優先檔案小
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "screenrecorder-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "螢幕錄影：單一執行檔（錄影、轉檔、剪輯、系統匣與 egui 操作視窗）"
build = "build.rs"

[dependencies]
screenrecorder-core = { path = "../core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
# 與 eframe 相同版本：從系統匣顯示 / 隱藏視窗
winit = { version = "0.30.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "process", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tiny-skia = "0.12"
# 即時預覽：FFmpeg 的 RGBA 直接讀進 Color32（已在相依樹裡，egui 也用）
bytemuck = "1"

# 開發、測試用（Linux 上以 X11 顯示）
[target.'cfg(unix)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# 測試用：暫停時間（watch_changes）
tokio = { version = "1", features = ["test-util"] }

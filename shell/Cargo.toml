[package]
name = "screenrecorder-ui"
version = "1.0.0"
edition = "2021"
description = "螢幕錄影：單一執行檔（本機 API、錄影、系統匣、Tauri / WebView2 操作視窗）"
publish = false
license = "MIT"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
screenrecorder-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

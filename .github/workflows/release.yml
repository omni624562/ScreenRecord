# 測試 → 建置 exe → 確認不需要 Visual C++ 可轉散發套件 →（有憑證時）簽章 →（需要時）發佈 GitHub Release
#
# 什麼時候發佈：
#   - main 上的 Cargo.toml 版本還沒發佈過（合併改了版本號的 PR，或上次發佈失敗後合併的修正）→ 自動建立 tag 並發佈
#   - 推送 v* tag
#   - 在 Actions 頁面手動執行（分支選 main）並勾選 publish
# 其他情況（PR、版本已發佈過、手動執行沒勾 publish）只測試與建置，exe 附在該次執行上可下載試用。
#
# 發佈新版本：更新 Cargo.toml（workspace.package.version）與 CHANGELOG.md → 合併到 main（或推送 tag）
#
# 安全：
#   - 預設只能讀 repo；建立 Release 的 release 工作才有寫入權限（測試、建置時跑的程式拿不到）
#   - 簽章憑證只在「簽章」那一步讀得到（建置時會執行相依套件的 build script）
#   - 外部的 Actions 固定在某個 commit（註解是對應的版本），升級時一起改 commit 與註解
name: Release

on:
  push:
    tags: ["v*"]
    # 每次推送到 main 都執行：版本已經發佈過就只測試與建置。
    # 不限定改了哪些檔案，否則發佈失敗後合併的修正（例如只改測試）不會再觸發發佈
    branches: [main]
  # PR：在 Windows 上測試與建置，結果顯示在 PR 上
  pull_request:
  # 手動執行：預設只建置與測試；勾選 publish 才發佈
  workflow_dispatch:
    inputs:
      publish:
        description: "發佈 Release（只能在 main；以 Cargo.toml 的版本建立 tag，例如 v3.0.0）"
        type: boolean
        default: false

permissions:
  contents: read

# 同一個 PR 有新推送時，取消還在跑的舊執行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      # 要發佈的 tag（不發佈時是空的）
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 建置、測試時不留 GitHub 權杖在 .git/config
          persist-credentials: false

      # 固定版本：新版 Rust 加入的 clippy 規則不會突然讓發佈失敗（要升級時改這裡）
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master，2026-11
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 格式檢查
        run: cargo fmt --all --check

      - name: 程式碼檢查
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # 端對端測試（core/src/e2e_tests.rs）用的 FFmpeg：與程式下載的版本相同。
      # 下載失敗時那些測試會自動略過，其他測試照跑
      - name: 下載 FFmpeg（端對端測試用）
        continue-on-error: true
        shell: pwsh
        run: |
          $v = (Select-String -Path core/src/downloader.rs -Pattern 'FFMPEG_VERSION: &str = "([^"]+)"').Matches[0].Groups[1].Value
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg")
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "ffmpeg") -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          & $exe.FullName -hide_banner -version | Select-Object -First 1
          "SCREENRECORDER_TEST_FFMPEG=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: 測試
        run: cargo test --locked --workspace

      # 要發佈的 tag（不發佈時留空）：
      #   推送 tag → 那個 tag；手動勾選 publish → Cargo.toml 的版本；
      #   推送到 main → Cargo.toml 的版本，但已經發佈過就不再發佈
      - name: 決定發佈版本
        id: version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$PUBLISH" == true ]] || { echo "手動執行未勾選 publish：只建置"; exit 0; }
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::只能從 main 發佈（目前是 $GITHUB_REF_NAME）"; exit 1; }
            tag="$version"
          elif gh release view "$version" > /dev/null 2>&1; then
            echo "$version 已經發佈過：只建置"
          else
            echo "main 的版本 $version 尚未發佈：建置後自動發佈"
            tag="$version"
          fi
          if [[ -n "$tag" ]]; then
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: 建置 exe
        shell: bash
        run: |
          cargo build --release --locked -p screenrecorder-ui
          mkdir -p dist
          cp target/release/screenrecorder-ui.exe dist/ScreenRecorder.exe
          ls -l dist/ScreenRecorder.exe

      # 乾淨安裝的 Windows 沒有 Visual C++ 可轉散發套件：exe 匯入它的 DLL（VCRUNTIME140.dll、MSVCP140.dll 等）就開不起來。
      # C 執行階段在 .cargo/config.toml 設定靜態連結，這裡確認真的沒有匯入（含延遲載入）
      - name: 確認不需要 Visual C++ 可轉散發套件
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "找不到 dumpbin.exe" }
          $out = & $dumpbin /nologo /dependents dist\ScreenRecorder.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin 執行失敗" }
          $out
          $dlls = foreach ($line in $out) { if ($line -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
          if (-not $dlls) { throw "讀不到 exe 匯入的 DLL" }
          $bad = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|msvcr|concrt|vccorlib|vcomp)\d' }
          if ($bad) { throw "exe 需要 Visual C++ 可轉散發套件的 DLL：$($bad -join '、')（.cargo/config.toml 的 crt-static 沒有生效？設了 RUSTFLAGS 時不會讀那裡的設定）" }
          "沒有匯入 Visual C++ 可轉散發套件的 DLL（共 $(@($dlls).Count) 個 DLL）"

      - name: 確認版本與更新說明
        if: env.RELEASE_TAG != ''
        shell: bash
        run: bash .github/scripts/release-notes.sh "${RELEASE_TAG}" dist/ScreenRecorder.exe > release-notes.md

      # 程式碼簽章（選用）：在 repo 的 Settings → Secrets 設定 SIGN_CERT_PFX（.pfx 的 base64）與 SIGN_CERT_PASSWORD 才會執行。
      # 步驟的 if 看不到 secrets：這一步只算出「有沒有設定」，憑證本身只放在「簽章」那一步
      - name: 檢查簽章憑證
        id: sign
        env:
          HAS_CERT: ${{ secrets.SIGN_CERT_PFX != '' }}
        shell: bash
        run: echo "has=$HAS_CERT" >> "$GITHUB_OUTPUT"

      - name: 簽章
        if: steps.sign.outputs.has == 'true'
        env:
          SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\ScreenRecorder.exe
          if ($LASTEXITCODE -ne 0) { throw "簽章失敗" }
          Remove-Item $pfx

      # 壓縮版（簽章後才壓縮，zip 內的 exe 也有簽章）
      - name: 壓縮
        shell: pwsh
        run: Compress-Archive -Path dist\ScreenRecorder.exe -DestinationPath dist\ScreenRecorder.zip -CompressionLevel Optimal

      # 試用版：只放 exe（GitHub 下載時本來就會包成 zip，再放 zip 會變成 zip 裡還有 zip）
      - name: 上傳建置結果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScreenRecorder
          path: dist/ScreenRecorder.exe

      # 要發佈時：exe、zip、更新說明交給 release 工作
      - name: 上傳要發佈的檔案
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/ScreenRecorder.exe
            dist/ScreenRecorder.zip
            release-notes.md
          retention-days: 1

  # 建立 Release：只有這個工作能寫入 repo，而且只做這件事（不建置、不執行 repo 裡的程式）
  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      # 手動發佈時 tag 還不存在：--target 讓 gh 在這次建置的 commit 上建立 tag（推送 tag 時 tag 已存在，--target 不影響）
      - name: 發佈 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" release/dist/ScreenRecorder.zip release/dist/ScreenRecorder.exe --title "${RELEASE_TAG}" --notes-file release/release-notes.md --target "${GITHUB_SHA}"

# 測試 → 建置 exe →（有憑證時）簽章 →（需要時）發佈 GitHub Release
#
# 什麼時候發佈：
#   - main 上的 Cargo.toml 版本變成還沒發佈過的版本（合併改了版本號的 PR）→ 自動建立 tag 並發佈
#   - 推送 v* tag
#   - 在 Actions 頁面手動執行（分支選 main）並勾選 publish
# 其他情況（PR、版本已發佈過、手動執行沒勾 publish）只測試與建置，exe 附在該次執行上可下載試用。
#
# 發佈新版本：更新 Cargo.toml（workspace.package.version）與 CHANGELOG.md → 合併到 main（或推送 tag）
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    # 只有版本號或這個流程本身有變動時才執行（tag 推送不受 paths 限制）
    paths: ["Cargo.toml", ".github/workflows/release.yml", ".github/scripts/**"]
  # PR：在 Windows 上測試與建置，結果顯示在 PR 上
  pull_request:
  # 手動執行：預設只建置與測試；勾選 publish 才發佈
  workflow_dispatch:
    inputs:
      publish:
        description: "發佈 Release（只能在 main；以 Cargo.toml 的版本建立 tag，例如 v3.0.0）"
        type: boolean
        default: false

permissions:
  contents: write

# 同一個 PR 有新推送時，取消還在跑的舊執行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    env:
      # 步驟的 if 看不到 secrets，先放進 env 判斷有沒有設定
      SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
    steps:
      - uses: actions/checkout@v4

      # 固定版本：新版 Rust 加入的 clippy 規則不會突然讓發佈失敗（要升級時改這裡）
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 格式檢查
        run: cargo fmt --all --check

      - name: 程式碼檢查
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: 測試
        run: cargo test --locked --workspace

      # 要發佈的 tag（不發佈時留空）：
      #   推送 tag → 那個 tag；手動勾選 publish → Cargo.toml 的版本；
      #   推送到 main → Cargo.toml 的版本，但已經發佈過就不再發佈
      - name: 決定發佈版本
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$PUBLISH" == true ]] || { echo "手動執行未勾選 publish：只建置"; exit 0; }
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::只能從 main 發佈（目前是 $GITHUB_REF_NAME）"; exit 1; }
            echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
          elif gh release view "$version" > /dev/null 2>&1; then
            echo "$version 已經發佈過：只建置"
          else
            echo "main 的版本 $version 尚未發佈：建置後自動發佈"
            echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
          fi

      - name: 建置 exe
        shell: bash
        run: |
          cargo build --release --locked -p screenrecorder-ui
          mkdir -p dist
          cp target/release/screenrecorder-ui.exe dist/ScreenRecorder.exe
          ls -l dist/ScreenRecorder.exe

      - name: 確認版本與更新說明
        if: env.RELEASE_TAG != ''
        shell: bash
        run: bash .github/scripts/release-notes.sh "${RELEASE_TAG}" dist/ScreenRecorder.exe > release-notes.md

      # 程式碼簽章（選用）：在 repo 的 Settings → Secrets 設定 SIGN_CERT_PFX（.pfx 的 base64）與 SIGN_CERT_PASSWORD 才會執行
      - name: 簽章
        if: env.SIGN_CERT_PFX != ''
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\ScreenRecorder.exe
          if ($LASTEXITCODE -ne 0) { throw "簽章失敗" }
          Remove-Item $pfx

      # 壓縮版（簽章後才壓縮，zip 內的 exe 也有簽章）
      - name: 壓縮
        shell: pwsh
        run: Compress-Archive -Path dist\ScreenRecorder.exe -DestinationPath dist\ScreenRecorder.zip -CompressionLevel Optimal

      - name: 上傳建置結果
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder
          path: |
            dist/ScreenRecorder.exe
            dist/ScreenRecorder.zip

      # 手動發佈時 tag 還不存在：--target 讓 gh 在這次建置的 commit 上建立 tag（推送 tag 時 tag 已存在，--target 不影響）
      - name: 發佈 Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${RELEASE_TAG}" dist/ScreenRecorder.zip dist/ScreenRecorder.exe --title "${RELEASE_TAG}" --notes-file release-notes.md --target "${GITHUB_SHA}"

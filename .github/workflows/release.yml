# 推送 v* tag 時：測試 → 建置 exe →（有憑證時）簽章 → 發佈 GitHub Release
# 發佈新版本：更新 package.json 版本與 CHANGELOG.md → commit → 下列其中一種
#   - git tag v1.2.0 → git push --follow-tags
#   - 不用 git：在 Actions 頁面手動執行（分支選 main），勾選「發佈 Release」，tag 由 package.json 的版本自動建立
name: Release

on:
  push:
    tags: ["v*"]
  # 手動執行：預設只建置與測試，不發佈（在 Actions 頁面下載 exe 試用）；勾選 publish 才發佈
  workflow_dispatch:
    inputs:
      publish:
        description: "發佈 Release（只能在 main；以 package.json 的版本建立 tag，例如 v1.3.0）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 步驟的 if 看不到 secrets，先放進 env 判斷有沒有設定
      SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安裝套件
        run: bun install --frozen-lockfile

      - name: 型別檢查
        run: bun run typecheck

      - name: 測試
        run: bun test

      # 要發佈的 tag：推送 tag 時就是那個 tag；手動執行勾選發佈時用 package.json 的版本
      - name: 決定發佈版本
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::只能從 main 發佈（目前是 $GITHUB_REF_NAME）"; exit 1
          else
            echo "RELEASE_TAG=v$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_ENV"
          fi

      - name: 確認版本與更新說明
        if: env.RELEASE_TAG != ''
        shell: bash
        run: bun run scripts/release-notes.ts --check-tag "${RELEASE_TAG}" > release-notes.md

      - name: 建置 exe
        run: bun run build

      # 程式碼簽章（選用）：在 repo 的 Settings → Secrets 設定 SIGN_CERT_PFX（.pfx 的 base64）與 SIGN_CERT_PASSWORD 才會執行
      - name: 簽章
        if: env.SIGN_CERT_PFX != ''
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\ScreenRecorder.exe
          if ($LASTEXITCODE -ne 0) { throw "簽章失敗" }
          Remove-Item $pfx

      # 壓縮版：exe 幾乎都是 Bun 執行環境，zip 後下載量約少 60%（簽章後才壓縮，zip 內的 exe 也有簽章）
      - name: 壓縮
        shell: pwsh
        run: Compress-Archive -Path dist\ScreenRecorder.exe -DestinationPath dist\ScreenRecorder.zip -CompressionLevel Optimal

      - name: 上傳建置結果
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder
          path: |
            dist/ScreenRecorder.exe
            dist/ScreenRecorder.zip

      # 手動發佈時 tag 還不存在：--target 讓 gh 在這次建置的 commit 上建立 tag（推送 tag 時 tag 已存在，--target 不影響）
      - name: 發佈 Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${RELEASE_TAG}" dist/ScreenRecorder.zip dist/ScreenRecorder.exe --title "${RELEASE_TAG}" --notes-file release-notes.md --target "${GITHUB_SHA}"
